# .github/workflows/build.yaml
name: Build Go App for Multiple Platforms

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch

  build:
    needs: tag
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Test
        run: go test -v ./...

      - name: Build for ${{ matrix.platform.goos }}/${{ matrix.platform.goarch }}
        env:
          GOOS: ${{ matrix.platform.goos }}
          GOARCH: ${{ matrix.platform.goarch }}
          CGO_ENABLED: 0
        run: |
          BASE_NAME=pasty-${{ matrix.platform.goos }}-${{ matrix.platform.goarch }}
          BINARY_NAME=$BASE_NAME
          if [ "${{ matrix.platform.goos }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          go build -o ./bin/$BINARY_NAME ./

          # Scoop's autoupdate expects a file containing just the hash,
          # named <base>.sha256 (e.g. pasty-windows-amd64.sha256)
          cd bin
          sha256sum "$BINARY_NAME" | cut -d' ' -f1 > "${BASE_NAME}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pasty-${{ matrix.platform.goos }}-${{ matrix.platform.goarch }}
          path: ./bin/pasty-*

  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.new_tag }}
          name: Release ${{ needs.tag.outputs.new_tag }}
          generate_release_notes: true
          files: |
            ./dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  scoop:
    needs: [tag, release]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: pasty-windows-amd64
          path: ./dist

      - name: Checkout scoop bucket
        uses: actions/checkout@v4
        with:
          repository: Mnrikard/scoop-bucket
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: bucket

      - name: Patch manifest
        env:
          TAG: ${{ needs.tag.outputs.new_tag }}
        run: |
          VERSION="${TAG#v}"
          HASH="$(tr -d '[:space:]' < ./dist/pasty-windows-amd64.sha256)"
          URL="https://github.com/Mnrikard/pasty/releases/download/${TAG}/pasty-windows-amd64.exe"

          cd bucket
          jq --arg v "$VERSION" --arg h "$HASH" --arg u "$URL" \
            '.version = $v
             | .architecture."64bit".url = $u
             | .architecture."64bit".hash = $h' \
            bucket/pasty.json > tmp && mv tmp bucket/pasty.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update pasty to $VERSION"
          git push
